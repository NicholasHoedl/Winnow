# Production stack for the home-server deploy (Checkpoint 0.4).
# Fronted by `tailscale serve` (HTTPS) — the app binds to localhost only.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env with POSTGRES_PASSWORD and AUTH_SECRET set.
name: winnow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: winnow-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://winnow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/winnow
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Chicago}
      APP_CURRENCY: ${APP_CURRENCY:-USD}
      # No AI_* here: as of T11 the companion is configured in the app's Settings page and
      # stored in the database, so it survives a redeploy without touching this file.
      NODE_ENV: production
    ports:
      # localhost only — tailscale serve terminates TLS and proxies to this.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: winnow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: winnow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winnow -d winnow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
