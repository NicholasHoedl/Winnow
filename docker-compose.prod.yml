# Production stack for the home-server deploy (Checkpoint 0.4).
# Fronted by `tailscale serve` (HTTPS) — the app binds to localhost only.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env with POSTGRES_PASSWORD and AUTH_SECRET set.
name: winnow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: winnow-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://winnow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/winnow
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Chicago}
      APP_CURRENCY: ${APP_CURRENCY:-USD}
      # The AI companion (ADR-0011). Forwarded explicitly because the container inherits
      # nothing from the host's .env - without these five lines the companion is off in
      # production no matter what .env says, and /companion 404s with its nav tab hidden.
      # All default to empty, so the feature stays off until they are actually set.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      NODE_ENV: production
    ports:
      # localhost only — tailscale serve terminates TLS and proxies to this.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/login'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: winnow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: winnow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winnow -d winnow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
