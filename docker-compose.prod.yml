# About this file: the Docker Compose stack for a production install, with an app
# container, a Postgres container, and a volume that holds the data.
#
# What you'll find here:
# - `name`: the Compose project name, `winnow`.
# - `app`: the Next.js server, built from `Dockerfile`. It starts once Postgres is
#   healthy, takes its database URL, auth secret and time zone from the environment, is
#   published on `127.0.0.1:3000`, and is healthy when `/login` loads.
# - `postgres`: Postgres 17 with the `winnow` user and database, checked by `pg_isready`.
# - `volumes`: `pgdata`, where the database's files outlive the containers.
#
# Related: `docs/runbooks/deploy.md`, the steps for standing this stack up on the server.

# Production stack for the home-server deploy (Checkpoint 0.4).
# Fronted by `tailscale serve` (HTTPS) — the app binds to localhost only.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env with POSTGRES_PASSWORD and AUTH_SECRET set.
name: winnow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: winnow-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://winnow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/winnow
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Chicago}
      # No APP_CURRENCY and no AI_* here. Both moved into `user_preferences` — the currency
      # in T12i, the companion's whole configuration in T11 — so they survive a redeploy and
      # are set from the app rather than from this file. Passing them did nothing, which is
      # worse than omitting them: it invites someone to set one and expect an effect.
      NODE_ENV: production
    ports:
      # localhost only — tailscale serve terminates TLS and proxies to this.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: winnow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: winnow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winnow -d winnow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
